```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청소당번 뽑기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
      background: #f2f6ff;
    }

    .container {
      width: 90%;
      max-width: 700px;
      padding: 50px 30px;

      text-align: center;

      background: white;
      border-radius: 25px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 40px;
    }

    .description {
      margin-bottom: 40px;
      font-size: 18px;
      color: #666;
    }

    .result {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .number {
      width: 80px;
      height: 80px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;

      background: #4f7cff;
      color: white;

      font-size: 30px;
      font-weight: bold;

      box-shadow: 0 5px 15px rgba(79, 124, 255, 0.3);

      transition: 0.2s;
    }

    .number.active {
      transform: scale(1.15);
    }

    button {
      padding: 15px 35px;

      border: none;
      border-radius: 12px;

      background: #222;
      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #444;
    }

    button:active {
      transform: scale(0.97);
    }

    #message {
      margin-top: 25px;
      font-size: 16px;
      color: #777;
    }

    @media (max-width: 600px) {
      .result {
        gap: 8px;
      }

      .number {
        width: 55px;
        height: 55px;
        font-size: 22px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🧹 청소당번 뽑기</h1>

    <p class="description">
      1번 ~ 24번 중 5명을 랜덤으로 뽑습니다.
    </p>

    <div class="result">
      <div class="number">?</div>
      <div class="number">?</div>
      <div class="number">?</div>
      <div class="number">?</div>
      <div class="number">?</div>
    </div>

    <button id="drawButton">
      청소당번 뽑기
    </button>

    <p id="message">
      버튼을 눌러주세요!
    </p>

  </div>


  <script>
    const drawButton = document.getElementById("drawButton");
    const numberElements = document.querySelectorAll(".number");
    const message = document.getElementById("message");

    drawButton.addEventListener("click", drawStudents);

    function drawStudents() {

      // 1번 ~ 24번 생성
      const students = [];

      for (let i = 1; i <= 24; i++) {
        students.push(i);
      }

      // 번호 섞기
      for (let i = students.length - 1; i > 0; i--) {

        const randomIndex =
          Math.floor(Math.random() * (i + 1));

        [students[i], students[randomIndex]] =
          [students[randomIndex], students[i]];
      }

      // 5명 선택
      const selected = students.slice(0, 5);

      // 번호 순서대로 정렬
      selected.sort((a, b) => a - b);

      // 화면 출력
      numberElements.forEach((element, index) => {

        element.classList.remove("active");

        setTimeout(() => {
          element.textContent = selected[index];
          element.classList.add("active");
        }, index * 150);

      });

      message.textContent =
        `오늘의 청소당번은 ${selected.join("번, ")}번입니다! 🧹`;
    }
  </script>

</body>
</html>
```
